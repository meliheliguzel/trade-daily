name: CI & Quality Control

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check

      - name: Verify Packaging Dry-Run
        run: uv run tradedaily-build --skip-build

  test:
    name: Test Suite (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (Qt/OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run PyTest (Linux Headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest --cov=config --cov=module --cov=windows --cov=scripts --cov-report=xml --cov-report=term

      - name: Run PyTest (Windows / macOS)
        if: runner.os != 'Linux'
        run: uv run pytest --cov=config --cov=module --cov=windows --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload Test Coverage Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
